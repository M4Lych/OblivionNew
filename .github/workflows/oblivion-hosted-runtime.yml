name: Oblivion Hosted Runtime (patch branch)

on:
  push:
    branches: [ "Patch", "Patch-Rebuild" ]
    paths:
      - 'hosted-runtime/**'
      - '.github/workflows/oblivion-hosted-runtime.yml'
  pull_request:
    branches: [ "main", "Patch", "Patch-Rebuild" ]
    paths:
      - 'hosted-runtime/**'
      - '.github/workflows/oblivion-hosted-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Hosted runtime source preflight
        run: python3 hosted-runtime/scripts/verify_source.py

      - name: Build ARM64 debug APK
        working-directory: hosted-runtime
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-HostedRuntime-ARM64-Debug
          path: hosted-runtime/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
