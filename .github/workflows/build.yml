name: Oblivion Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to produce"
        type: choice
        default: all
        options: [all, debug, beta, release]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # The native sources live in git submodules. If this repository was created from a zip
      # (no gitlinks), fetch them explicitly so the NDK build always has its inputs.
      - name: Ensure native submodules
        run: |
          set -euo pipefail
          fetch() {
            dir="$1"; url="$2"
            if [ ! -e "$dir/CMakeLists.txt" ] && [ -z "$(ls -A "$dir" 2>/dev/null || true)" ]; then
              rm -rf "$dir"
              git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$dir"
            fi
          }
          fetch app/src/main/cpp/preloader https://github.com/LiteLDev/preloader-android
          fetch app/src/main/cpp/libHttpClient https://github.com/microsoft/libHttpClient
          git -C app/src/main/cpp/libHttpClient submodule update --init --recursive || true
          ls app/src/main/cpp/preloader | head
          ls app/src/main/cpp/libHttpClient | head

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0" "platforms;android-36"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "No Firebase secret set: using a placeholder (the game still builds and runs)."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "oblivion-placeholder",
              "storage_bucket": "oblivion-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.oblivion.launcher" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyOblivionPlaceholderKey000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.OBLIVION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OBLIVION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OBLIVION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OBLIVION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oblivion.jks"
            {
              echo "OBLIVION_KEYSTORE_PATH=$RUNNER_TEMP/oblivion.jks"
              echo "OBLIVION_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "OBLIVION_KEY_ALIAS=$KEY_ALIAS"
              echo "OBLIVION_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "No keystore secret: beta/release APKs will be signed with the debug key (fine for testing)."
          fi

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "OBLIVION_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Select Gradle tasks
        id: tasks
        run: |
          variant="${{ github.event.inputs.variant }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then variant=all; fi
          case "${variant:-}" in
            debug)   t="assembleDebug" ;;
            beta)    t="assembleBeta" ;;
            release) t="assembleRelease" ;;
            all)     t="assembleDebug assembleBeta assembleRelease" ;;
            *)       t="assembleDebug assembleBeta" ;;
          esac
          echo "tasks=$t" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ steps.tasks.outputs.tasks }} --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${{ steps.ver.outputs.version }}"
          for variant in debug beta release; do
            apk=$(ls app/build/outputs/apk/$variant/*.apk 2>/dev/null | head -n1 || true)
            if [ -n "$apk" ]; then cp "$apk" "dist/Oblivion-${v}-${variant}.apk"; fi
          done
          ls -la dist

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-debug
          path: dist/*-debug.apk
          if-no-files-found: ignore

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-beta
          path: dist/*-beta.apk
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-release
          path: dist/*-release.apk
          if-no-files-found: ignore

      - name: Upload R8 mappings
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-r8-mappings-${{ github.sha }}
          path: app/build/outputs/mapping/
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true

  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Unit tests (non-blocking)
        run: |
          mkdir -p app && echo '{"project_info":{"project_number":"0","project_id":"p","storage_bucket":"p.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.oblivion.launcher"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyOblivionPlaceholderKey000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon || true
