def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def curseForgeApiKey = localProperties.getProperty('curseforge.api_key', '').trim()

def getGitTag() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def tag = stdout.toString().trim()
        if (tag.startsWith('v')) tag = tag.substring(1)
        return tag ? tag : '0.1.0'
    } catch (ignored) {
        return '0.1.0'
    }
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse('yyyy-MM-dd HH:mm:ss', '2025-01-01 00:00:00')
    return ((new Date().time - baseDate.time) / 1000).toInteger()
}

android {
    // Keep the upstream source namespace for compatibility with LeviLauncher/XAL classes.
    // The installed application identity is Oblivion and can coexist with the upstream app.
    namespace 'org.levimc.launcher'
    compileSdkVersion 36

    defaultConfig {
        applicationId 'org.oblivionmc.launcher'
        minSdkVersion 28
        targetSdkVersion 35
        versionCode getVersionCodeByTimestamp()
        versionName getGitTag()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'CURSEFORGE_API_KEY', groovy.json.JsonOutput.toJson(curseForgeApiKey)
        buildConfigField 'boolean', 'SKIP_PLAY_STORE_CHECK', 'false'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs += rootProject.file('resources')
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Oblivion Debug'
            buildConfigField 'boolean', 'IS_BETA', 'false'
            buildConfigField 'boolean', 'SKIP_PLAY_STORE_CHECK', 'false'
        }

        beta {
            initWith debug
            debuggable true
            minifyEnabled false
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            resValue 'string', 'app_name', 'Oblivion Beta'
            buildConfigField 'boolean', 'IS_BETA', 'true'
            matchingFallbacks = ['debug']
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField 'boolean', 'IS_BETA', 'false'
            buildConfigField 'boolean', 'SKIP_PLAY_STORE_CHECK', 'false'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                    '**/libpreloader.so',
                    '**/libgxcore.so',
                    '**/libinbuiltmods.so'
            ]
        }
        resources.excludes += ['DebugProbesKt.bin']
        resources.pickFirsts += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/io.netty.versions.properties'
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    ndkVersion = '28.2.13676358'
}

